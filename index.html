<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSE 5000+ 單字神器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyC_RkNFqihJ8rkuFsSOf1l9XX7c71sQxng",
      authDomain: "dse-vocab-5dcac.firebaseapp.com",
      projectId: "dse-vocab-5dcac",
      storageBucket: "dse-vocab-5dcac.firebasestorage.app",
      messagingSenderId: "79608998812",
      appId: "1:79608998812:web:0da90310b1e9b25a2ef659",
      measurementId: "G-3K0PSN3EGD"
    };

    let auth = null;
    let db = null;

    try {
      if (firebaseConfig.apiKey) {
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
      }
    } catch(e) {
      console.log("Firebase 初始化失敗", e);
    }

    const { useState, useEffect, useRef, useMemo } = React;

    function App() {
      const [words, setWords] = useState([]);
      const [view, setView] = useState('import');
      const [studyMode, setStudyMode] = useState('all');
      const [studyIndex, setStudyIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      
      const [definition, setDefinition] = useState(null); 
      const [isLoadingDef, setIsLoadingDef] = useState(false);
      
      const [isParsing, setIsParsing] = useState(false);
      const [parseStatus, setParseStatus] = useState('');
      const [listPage, setListPage] = useState(1);
      const [searchQuery, setSearchQuery] = useState('');
      const [listFilter, setListFilter] = useState('all');
      const [sortBy, setSortBy] = useState('alpha');
      const [customWordInput, setCustomWordInput] = useState('');
      const [wordToDelete, setWordToDelete] = useState(null);
      const [showClearConfirmModal, setShowClearConfirmModal] = useState(false);
      const [activeDetailWord, setActiveDetailWord] = useState(null);
      const [detailNoteInput, setDetailNoteInput] = useState('');
      
      const [detailDef, setDetailDef] = useState(null);
      const [isLoadingDetailDef, setIsLoadingDetailDef] = useState(false);
      const [detailStatus, setDetailStatus] = useState('new');
      
      const [user, setUser] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);

      const [defLang, setDefLang] = useState(localStorage.getItem('dse_vocab_lang') || 'both');

      const LIST_PAGE_SIZE = 20;
      const fileInputRef = useRef(null);
      const LOCAL_STORAGE_KEY = 'dse_vocab_react_final_web_v11';

      const loadLocalData = () => {
        const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.length > 0) { 
              setWords(parsed); 
              setView('stats'); 
            }
          } catch (e) { console.error(e); }
        }
      };

      const fetchCloudDataForUser = async (currentUser) => {
        if (!db || !currentUser) return;
        setIsSyncing(true);
        try {
          const docRef = db.collection('users').doc(currentUser.uid);
          const docSnap = await docRef.get();
          if (docSnap.exists && docSnap.data().words && docSnap.data().words.length > 0) {
            const cloudWords = docSnap.data().words;
            setWords(cloudWords);
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(cloudWords));
            setView('stats');
          } else {
            const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (saved) {
              const parsed = JSON.parse(saved);
              if (parsed.length > 0) {
                setWords(parsed);
                await docRef.set({ words: parsed, updatedAt: new Date().toISOString() });
                setView('stats');
              }
            }
          }
        } catch(e) {
          console.error("雲端讀取錯誤", e);
        } finally {
          setIsSyncing(false);
        }
      };

      useEffect(() => {
        if (auth) {
          const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
            setUser(currentUser);
            if (currentUser) {
              await fetchCloudDataForUser(currentUser);
            } else {
              loadLocalData();
            }
            setAuthLoading(false);
          });
          return () => unsubscribe();
        } else {
          loadLocalData();
          setAuthLoading(false);
        }
        
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }
      }, []);

      useEffect(() => {
        if (words.length > 0 && !authLoading) {
          const safeWords = words.length > 6000 ? words.slice(0, 6000) : words;
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(safeWords));
          
          if (user && db) {
            db.collection('users').doc(user.uid).set({
              words: safeWords,
              updatedAt: new Date().toISOString()
            }).catch(e => console.error("自動同步失敗", e));
          }
        }
      }, [words, user, db, authLoading]);

      const handleGoogleLogin = async () => {
        if (!auth) return;
        setIsSyncing(true);
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          const result = await auth.signInWithPopup(provider);
          if (result.user) {
            setUser(result.user);
            await fetchCloudDataForUser(result.user); 
          }
        } catch (e) {
          try {
            await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
          } catch(err) {
            alert("登入被阻擋或失敗，請檢查瀏覽器設定。");
            setIsSyncing(false);
          }
        }
      };

      const handleLogout = async () => {
        if (auth) {
          await auth.signOut();
          setUser(null);
          setWords([]);
          setView('import');
          alert("已成功登出。");
        }
      };

      const manualUploadToCloud = async () => {
        if (!user || !db) return;
        if (words.length === 0) { alert("目前沒有單字可同步！"); return; }
        setIsSyncing(true);
        try {
          await db.collection('users').doc(user.uid).set({
            words: words,
            updatedAt: new Date().toISOString()
          });
          alert("成功手動同步目前進度到雲端！");
        } catch(e) {
          alert("同步失敗");
        } finally {
          setIsSyncing(false);
        }
      };

      const studyList = useMemo(() => {
        if (studyMode === 'all') return words;
        return words.filter(w => w.status === studyMode);
      }, [words, studyMode]);

      useEffect(() => {
        if (studyList.length > 0 && studyIndex >= studyList.length) {
          setStudyIndex(Math.max(0, studyList.length - 1));
        }
      }, [studyList.length, studyIndex]);

      const loadPdfJs = () => {
        return new Promise((resolve, reject) => {
          if (window.pdfjsLib) return resolve(window.pdfjsLib);
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js';
          script.onload = () => {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            resolve(window.pdfjsLib);
          };
          script.onerror = () => reject(new Error("PDF套件載入失敗"));
          document.head.appendChild(script);
        });
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsParsing(true);
        setParseStatus('初始化解析引擎...');

        try {
          const buffer = await file.arrayBuffer();
          const pdfjs = await loadPdfJs();
          const pdf = await pdfjs.getDocument({ data: buffer }).promise;
          let fullText = '';

          for (let i = 1; i <= pdf.numPages; i++) {
            if (i % 5 === 0) {
              setParseStatus(`解析頁面 (${i}/${pdf.numPages})...`);
              await new Promise(r => setTimeout(r, 10));
            }
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(item => item.str).join(' ') + ' ';
          }

          setParseStatus('過濾雜訊與重複單字...');
          await new Promise(r => setTimeout(r, 10));

          const extracted = fullText.match(/\b[a-zA-Z-]+\b/g);
          if (!extracted) throw new Error("找不到英文單字");

          const ignoreList = new Set(['page', 'vocabularylist', 'words', 'p']);
          const uniqueMap = new Map();

          extracted.forEach(w => {
            let clean = w.toLowerCase().replace(/^[-]+|[-]+$/g, '');
            if ((clean.length > 1 || clean === 'a' || clean === 'i') && !ignoreList.has(clean) && !clean.startsWith('vocabularylist')) {
              uniqueMap.set(clean, true);
            }
          });

          const newWords = Array.from(uniqueMap.keys()).map(w => ({ word: w, status: 'new', note: '' }));
          setWords(newWords);
          setStudyMode('all');
          setStudyIndex(0);
          setView('stats');
        } catch (err) {
          alert("解析失敗，請確認檔案格式正確。");
        } finally {
          setIsParsing(false);
          setParseStatus('');
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      };

      const speakWord = (wordStr, accent = 'US', e) => {
        if (e) e.stopPropagation();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(wordStr);
          
          const voices = window.speechSynthesis.getVoices();
          let targetVoice = null;
          
          if (accent === 'UK') {
            utter.lang = 'en-GB';
            targetVoice = voices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB');
          } else {
            utter.lang = 'en-US';
            targetVoice = voices.find(v => v.lang === 'en-US' || v.lang === 'en_US');
          }
          
          if (targetVoice) utter.voice = targetVoice;
          utter.rate = 0.85; 
          
          window.speechSynthesis.speak(utter);
        }
      };

      // 改用 Google Translate API 確保返回繁體中文 (zh-TW)
      const fetchDefinitionApi = async (wordStr) => {
        let dictData = null;
        let transData = null;
        
        try {
          // 1. 抓取英文解釋
          const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${wordStr}`);
          if (dictRes.ok) {
            dictData = (await dictRes.json())[0];
          }
          
          // 2. 抓取中文翻譯 (Google Translate API - 確保繁體字)
          const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(wordStr)}`);
          if (transRes.ok) {
            const transJson = await transRes.json();
            if (transJson && transJson[0] && transJson[0][0] && transJson[0][0][0]) {
               transData = transJson[0][0][0];
            }
          }
        } catch (e) {
           console.error("API Fetch Error", e);
        }
        
        return { dict: dictData, translation: transData };
      };

      const fetchDefinitionForCard = async (wordStr) => {
        setIsLoadingDef(true);
        setDefinition(null);
        
        const result = await fetchDefinitionApi(wordStr);
        if (result.dict || result.translation) {
           setDefinition(result);
        } else {
           setDefinition({ notFound: true });
        }
        setIsLoadingDef(false);
      };

      const openWordDetail = async (item) => {
        setActiveDetailWord(item);
        setDetailNoteInput(item.note || '');
        setDetailStatus(item.status);
        setIsLoadingDetailDef(true);
        setDetailDef(null);

        const result = await fetchDefinitionApi(item.word);
        if (result.dict || result.translation) {
           setDetailDef(result);
        } else {
           setDetailDef({ notFound: true });
        }
        setIsLoadingDetailDef(false);
      };

      const saveWordDetail = () => {
        if (!activeDetailWord) return;
        setWords(prev => prev.map(w => w.word === activeDetailWord.word ? { ...w, note: detailNoteInput, status: detailStatus } : w));
        setActiveDetailWord(null);
        alert("備註與狀態已成功儲存！");
      };

      const handleFlip = () => {
        if (!isFlipped && studyList.length > 0) fetchDefinitionForCard(studyList[studyIndex].word);
        setIsFlipped(!isFlipped);
      };

      const changeWordStatus = (wordStr, newStatus) => {
        setWords(prev => prev.map(w => w.word === wordStr ? { ...w, status: newStatus } : w));
      };

      const handleMarkCard = (status, e) => {
        if (e) e.stopPropagation();
        if (studyList.length === 0) return;
        changeWordStatus(studyList[studyIndex].word, status);
        setIsFlipped(false);

        if (studyIndex < studyList.length - 1) {
          setStudyIndex(prev => prev + 1);
        } else {
          alert('本階段已溫習完畢！');
          setView('stats');
        }
      };

      const handleUpdateNote = (wordStr, noteStr) => {
        setWords(prev => prev.map(w => w.word === wordStr ? { ...w, note: noteStr } : w));
      };

      const triggerDelete = (wordStr, e) => {
        if (e) { e.stopPropagation(); e.preventDefault(); }
        setWordToDelete(wordStr);
      };

      const confirmDelete = () => {
        if (!wordToDelete) return;
        setWords(prev => prev.filter(w => w.word !== wordToDelete));
        setIsFlipped(false);
        if (view === 'study' && studyIndex >= studyList.length - 1) {
          setStudyIndex(Math.max(0, studyList.length - 2));
        }
        setWordToDelete(null);
      };

      const executeClearAll = () => {
        setWords([]);
        localStorage.clear();
        if (user && db) {
          db.collection('users').doc(user.uid).delete();
        }
        setShowClearConfirmModal(false);
        setView('import');
        alert("已徹底清空所有記錄！");
      };

      const handleAddCustomWords = () => {
        if (!customWordInput.trim()) return;
        const extracted = customWordInput.match(/\b[a-zA-Z-]+\b/g);
        if (!extracted) { alert("無效的單字"); return; }

        const currentSet = new Set(words.map(w => w.word));
        const newAdditions = [];
        extracted.forEach(w => {
          const lower = w.toLowerCase();
          if (!currentSet.has(lower)) {
            newAdditions.push({ word: lower, status: 'new', note: '' });
            currentSet.add(lower);
          }
        });

        if (newAdditions.length > 0) {
          setWords(prev => [...prev, ...newAdditions]);
          alert(`新增了 ${newAdditions.length} 個單字！`);
          setCustomWordInput('');
        } else {
          alert("單字皆已存在。");
        }
      };
      
      const changeLangPreference = (e) => {
          setDefLang(e.target.value);
          localStorage.setItem('dse_vocab_lang', e.target.value);
      }

      // -- 渲染組件區域 --

      const renderImport = () => (
        <div className="flex flex-col items-center justify-center min-h-[75vh] py-8">
          <div className="w-full bg-indigo-50/70 p-5 rounded-3xl shadow-sm border border-indigo-100 flex flex-col items-center mb-6">
            <div className="text-3xl mb-2">☁️</div>
            <h3 className="text-lg font-bold text-gray-800 mb-1">雲端進度同步</h3>
            <p className="text-xs text-gray-500 text-center mb-4">登入 Google 帳號，跨裝置自動讀取你的字庫。</p>
            
            {authLoading ? (
               <div className="text-indigo-500 text-sm font-bold">檢查登入中...</div>
            ) : user ? (
              <div className="flex flex-col items-center w-full gap-2">
                <span className="text-xs font-bold text-green-600">✅ 已登入：{user.email}</span>
                <div className="flex gap-2 w-full">
                  <button onClick={() => fetchCloudDataForUser(user)} className="flex-1 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow cursor-pointer">📥 立即從雲端還原</button>
                  <button onClick={handleLogout} className="py-2 px-4 bg-white text-gray-700 border border-gray-300 rounded-xl text-xs font-bold shadow-xs cursor-pointer">登出</button>
                </div>
              </div>
            ) : (
              <button onClick={handleGoogleLogin} className="w-full py-3 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow hover:bg-indigo-700 transition cursor-pointer">
                使用 Google 帳號登入
              </button>
            )}
          </div>

          <div className="text-center mb-4">
            <div className="flex items-center justify-center gap-2 mb-2 text-gray-400">
              <span className="h-px bg-gray-200 w-12"></span>
              <span className="text-xs font-bold uppercase tracking-wider">或上傳新 PDF</span>
              <span className="h-px bg-gray-200 w-12"></span>
            </div>
          </div>

          <div className="w-full bg-white rounded-3xl shadow-xl p-6 border border-gray-100 flex flex-col items-center relative">
             {isSyncing && <div className="absolute inset-0 bg-white/80 z-10 flex items-center justify-center rounded-3xl"><span className="text-indigo-600 font-bold text-sm">雲端資料同步中...</span></div>}
            <div className="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center text-gray-400 mb-4 text-2xl border-2 border-dashed border-gray-200">📄</div>
            <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".pdf,.txt" className="hidden" />
            <button 
              onClick={() => fileInputRef.current.click()} 
              disabled={isParsing || isSyncing}
              className="w-full py-3 px-6 bg-gray-800 text-white font-bold rounded-xl shadow hover:bg-gray-900 transition flex justify-center text-sm disabled:opacity-50 cursor-pointer"
            >
              {isParsing ? parseStatus : "選擇 PDF 檔案上傳"}
            </button>
          </div>
        </div>
      );

      const renderStudy = () => {
        if (words.length === 0) return null;
        if (studyList.length === 0) {
          return (
            <div className="flex flex-col items-center justify-center py-20 text-center">
              <div className="text-4xl mb-4">🎉</div>
              <h2 className="text-xl font-bold text-gray-800">此範圍內沒有單字了！</h2>
              <button onClick={() => setView('stats')} className="mt-4 px-6 py-2 bg-indigo-600 text-white font-bold rounded-lg shadow cursor-pointer">返回統計</button>
            </div>
          );
        }

        const currentWordObj = studyList[studyIndex];
        const progress = Math.round((studyIndex / studyList.length) * 100);
        const modeLabels = { 'all': '全部', 'new': '未學', 'review': '錯題複習', 'known': '已掌握' };

        return (
          <div className="flex flex-col items-center w-full py-4 min-h-[85vh]">
            <div className="w-full flex justify-between items-center mb-3">
              <button onClick={() => setView('stats')} className="text-indigo-600 font-bold px-3 py-1 bg-indigo-50 rounded-lg text-xs hover:bg-indigo-100 cursor-pointer">
                統計 & 設定
              </button>
              <div className="flex items-center gap-2">
                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${studyMode === 'review' ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-600'}`}>
                  範圍: {modeLabels[studyMode]}
                </span>
                <div className="text-gray-500 text-xs font-mono font-bold bg-white px-2 py-1 rounded-lg border border-gray-200">
                  {studyIndex + 1} / {studyList.length}
                </div>
              </div>
            </div>

            <div className="w-full bg-gray-200 rounded-full h-1.5 mb-5 overflow-hidden">
              <div className="bg-indigo-600 h-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
            </div>

            <div className="w-full bg-white rounded-[2rem] shadow-xl border border-gray-100 min-h-[360px] flex flex-col p-6 relative overflow-hidden">
              {!isFlipped ? (
                <div className="text-center w-full break-words relative z-10 flex flex-col items-center justify-center h-full cursor-pointer" onClick={handleFlip}>
                  <button 
                    type="button" 
                    onClick={(e) => triggerDelete(currentWordObj.word, e)} 
                    className="absolute top-0 left-0 p-3 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-full transition z-20 cursor-pointer"
                  >🗑️</button>
                  <span className="text-[10px] uppercase tracking-widest text-indigo-400 font-bold mb-3 block bg-indigo-50 px-2 py-0.5 rounded-full mt-2">點擊卡片看解釋</span>
                  <h1 className="text-4xl font-black text-gray-900 tracking-tight mb-4">{currentWordObj.word}</h1>
                  
                  <div className="flex gap-3 justify-center mt-2">
                    <button onClick={(e) => speakWord(currentWordObj.word, 'UK', e)} className="px-3 py-2 bg-indigo-50 text-indigo-700 rounded-xl text-xs font-bold hover:bg-indigo-100 shadow-sm flex items-center gap-1 cursor-pointer">🇬🇧 英式</button>
                    <button onClick={(e) => speakWord(currentWordObj.word, 'US', e)} className="px-3 py-2 bg-indigo-50 text-indigo-700 rounded-xl text-xs font-bold hover:bg-indigo-100 shadow-sm flex items-center gap-1 cursor-pointer">🇺🇸 美式</button>
                  </div>

                  {currentWordObj.note && (
                    <div className="mt-5 text-xs text-amber-600 font-semibold flex items-center bg-amber-50 px-3 py-1 rounded-full">📝 包含個人備註</div>
                  )}
                </div>
              ) : (
                <div className="w-full h-full flex flex-col text-left relative z-10 max-h-[320px]">
                  <div className="flex justify-between items-start border-b pb-2 mb-2 sticky top-0 bg-white">
                    <h1 className="text-2xl font-black text-gray-900">{currentWordObj.word}</h1>
                    <div className="flex gap-1.5 shrink-0">
                       <button onClick={(e) => speakWord(currentWordObj.word, 'UK', e)} className="p-2 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 cursor-pointer text-xs" title="英式發音">🇬🇧</button>
                       <button onClick={(e) => speakWord(currentWordObj.word, 'US', e)} className="p-2 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 cursor-pointer text-xs" title="美式發音">🇺🇸</button>
                    </div>
                  </div>
                  
                  <div className="overflow-y-auto pr-1 flex-grow mb-2">
                    {isLoadingDef ? <div className="text-center py-6 text-sm text-gray-500">載入字典與翻譯中...</div> : definition?.notFound ? <div className="text-gray-400 text-xs italic py-4">自訂單字，無線上解釋。</div> : (
                      <div className="text-sm space-y-3 pb-2">
                        {/* 中文翻譯顯示 (若設定為 both 或 zh) */}
                        {(defLang === 'both' || defLang === 'zh') && definition?.translation && (
                           <div className="bg-indigo-50/50 p-3 rounded-xl border border-indigo-100">
                             <div className="text-[10px] text-indigo-400 font-bold mb-1 uppercase tracking-wider">繁體中文翻譯</div>
                             <div className="font-bold text-indigo-900 text-base">{definition.translation}</div>
                           </div>
                        )}
                        
                        {/* 英文解釋顯示 (若設定為 both 或 en) */}
                        {(defLang === 'both' || defLang === 'en') && definition?.dict?.meanings ? (
                           <div className="space-y-3">
                             <div className="text-[10px] text-gray-400 font-bold uppercase tracking-wider mt-2">English Definition</div>
                             {definition.dict.phonetic && <span className="font-mono text-gray-600 bg-gray-100 px-1.5 py-0.5 rounded text-xs font-bold inline-block">{definition.dict.phonetic}</span>}
                             
                             {definition.dict.meanings.map((m, i) => (
                               <div key={i}>
                                 <span className="inline-block px-1.5 py-0.5 bg-gray-800 text-white rounded text-[10px] font-bold mb-1">{m.partOfSpeech}</span>
                                 <ul className="list-disc pl-4 space-y-1 text-gray-700 text-xs">
                                   {m.definitions.slice(0, 2).map((def, j) => (
                                     <li key={j}><span className="font-medium">{def.definition}</span></li>
                                   ))}
                                 </ul>
                               </div>
                             ))}
                           </div>
                        ) : null}
                      </div>
                    )}
                  </div>
                  <div className="border-t border-gray-100 pt-3 mt-auto">
                    <label className="text-[10px] font-bold text-gray-500 uppercase flex items-center mb-1">📝 個人備註</label>
                    <textarea value={currentWordObj.note} onChange={(e) => handleUpdateNote(currentWordObj.word, e.target.value)} placeholder="輸入專屬筆記..." className="w-full text-xs p-2 bg-amber-50/50 border border-amber-100 rounded-lg outline-none resize-none h-16 text-gray-800" />
                  </div>
                </div>
              )}
            </div>

            <div className="w-full flex justify-between mt-5 gap-2">
              <button onClick={(e) => handleMarkCard('review', e)} className="flex-1 bg-white border-2 border-orange-200 text-orange-600 font-extrabold py-3 rounded-xl text-xs hover:bg-orange-50 cursor-pointer">🔄 忘記了</button>
              <button onClick={(e) => handleMarkCard('new', e)} className="flex-1 bg-white border-2 border-gray-200 text-gray-500 font-extrabold py-3 rounded-xl text-xs hover:bg-gray-50 cursor-pointer">⏭ 跳過</button>
              <button onClick={(e) => handleMarkCard('known', e)} className="flex-1 bg-white border-2 border-green-200 text-green-600 font-extrabold py-3 rounded-xl text-xs hover:bg-green-50 cursor-pointer">✅ 記得</button>
            </div>
          </div>
        );
      };

      const renderStats = () => {
        const known = words.filter(w => w.status === 'known').length;
        const review = words.filter(w => w.status === 'review').length;
        const newWords = words.filter(w => w.status === 'new').length;

        return (
          <div className="flex flex-col items-center py-6 w-full">
            <div className="text-5xl mb-3">🏆</div>
            <h2 className="text-xl font-bold text-gray-800 mb-5">學習進度總覽</h2>
            
            <div className="grid grid-cols-3 gap-3 w-full mb-6">
              <div className="bg-white p-3 rounded-xl shadow-sm text-center border-t-2 border-green-500"><p className="text-[10px] text-gray-400">已掌握</p><p className="text-xl font-bold text-green-600 mt-1">{known}</p></div>
              <div className="bg-white p-3 rounded-xl shadow-sm text-center border-t-2 border-orange-500"><p className="text-[10px] text-gray-400">需複習</p><p className="text-xl font-bold text-orange-600 mt-1">{review}</p></div>
              <div className="bg-white p-3 rounded-xl shadow-sm text-center border-t-2 border-gray-400"><p className="text-[10px] text-gray-400">未學</p><p className="text-xl font-bold text-gray-600 mt-1">{newWords}</p></div>
            </div>

            <div className="w-full flex flex-col gap-3">
              <div className="bg-indigo-50/70 p-4 rounded-xl shadow-sm border border-indigo-100 flex items-center justify-between">
                <div>
                  <p className="text-xs font-bold text-gray-800">☁️ 雲端帳號同步</p>
                  <p className="text-[10px] text-gray-500">
                    {user ? `已綁定: ${user.email}` : '尚未登入'}
                    {isSyncing && ' (同步中...)'}
                  </p>
                </div>
                <div className="flex gap-1.5">
                  <button onClick={manualUploadToCloud} className="px-2.5 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold shadow-xs cursor-pointer">同步雲端</button>
                  <button onClick={handleLogout} className="px-2.5 py-1.5 bg-white text-gray-700 border border-gray-300 rounded-lg text-xs font-bold shadow-xs cursor-pointer">登出</button>
                </div>
              </div>
              
              <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <label className="text-xs font-bold text-gray-700 block mb-2">🌐 解釋顯示語言：</label>
                <select value={defLang} onChange={changeLangPreference} className="w-full p-2.5 text-sm border border-gray-200 rounded-lg outline-none bg-gray-50 text-gray-800 font-semibold cursor-pointer">
                  <option value="both">中英雙語對照 (建議)</option>
                  <option value="zh">僅顯示繁體中文</option>
                  <option value="en">僅顯示英文解釋</option>
                </select>
              </div>

              <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <label className="text-xs font-bold text-gray-700 block mb-2">🎯 自訂溫習範圍：</label>
                <select value={studyMode} onChange={(e) => { setStudyMode(e.target.value); setStudyIndex(0); }} className="w-full p-2.5 text-sm border border-indigo-200 rounded-lg outline-none bg-indigo-50/50 text-indigo-900 font-semibold cursor-pointer mb-3">
                  <option value="all">全部單字</option>
                  <option value="new">🆕 只溫習「未學習」的單字</option>
                  <option value="review">🔄 只溫習「需複習」的錯題</option>
                  <option value="known">✅ 只溫習「已掌握」的單字</option>
                </select>
                <button onClick={() => { setStudyIndex(0); setView('study'); }} className="w-full py-3 bg-indigo-600 text-white font-bold rounded-lg text-sm shadow hover:bg-indigo-700 cursor-pointer">開始溫習</button>
              </div>

              <button onClick={() => setView('list')} className="w-full py-2.5 bg-white border border-gray-300 text-gray-700 font-bold rounded-xl text-xs hover:bg-gray-50 cursor-pointer">進入字庫管理 (點擊單字可看解釋與加備註)</button>
              <button onClick={() => setShowClearConfirmModal(true)} className="w-full mt-2 py-2 text-red-500 font-bold text-xs underline cursor-pointer">清空所有記錄並重新上傳</button>
            </div>
          </div>
        );
      };

      const renderList = () => {
        const filteredList = words.filter(w => {
          const matchSearch = w.word.includes(searchQuery.toLowerCase()) || (w.note && w.note.toLowerCase().includes(searchQuery.toLowerCase()));
          let matchStatus = true;
          if (listFilter === 'has_note') matchStatus = w.note && w.note.trim() !== '';
          else if (listFilter !== 'all') matchStatus = w.status === listFilter;
          return matchSearch && matchStatus;
        });

        const sortedList = [...filteredList].sort((a, b) => sortBy === 'alpha' ? a.word.localeCompare(b.word) : 0);
        const totalPages = Math.ceil(sortedList.length / LIST_PAGE_SIZE) || 1;
        const validPage = Math.min(listPage, totalPages);
        const paginatedList = sortedList.slice((validPage - 1) * LIST_PAGE_SIZE, validPage * LIST_PAGE_SIZE);

        return (
          <div className="flex flex-col w-full h-[85vh] py-4">
            <div className="flex justify-between items-center mb-3">
              <h2 className="text-lg font-bold text-gray-800">字庫管理 <span className="text-sm font-normal text-gray-500">({sortedList.length})</span></h2>
              <button onClick={() => setView('stats')} className="px-3 py-1.5 bg-indigo-600 text-white font-bold rounded-lg text-xs shadow cursor-pointer">返回統計</button>
            </div>

            <div className="bg-white p-3 rounded-xl shadow-sm border border-gray-100 mb-3 flex flex-col gap-2">
              <div className="flex gap-2">
                <input type="text" placeholder="搜尋單字/備註..." value={searchQuery} onChange={(e) => { setSearchQuery(e.target.value); setListPage(1); }} className="flex-1 p-2 text-xs border border-gray-300 rounded-lg outline-none" />
                <select value={listFilter} onChange={(e) => { setListFilter(e.target.value); setListPage(1); }} className="p-2 text-xs border border-gray-300 rounded-lg outline-none bg-gray-50 cursor-pointer">
                  <option value="all">全部狀態</option>
                  <option value="review">僅需複習</option>
                  <option value="new">未學習</option>
                  <option value="known">已掌握</option>
                  <option value="has_note">📝 有備註</option>
                </select>
              </div>
              <div className="flex gap-2">
                <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="p-2 text-xs border border-gray-300 rounded-lg outline-none bg-indigo-50 font-semibold text-indigo-900 flex-1 cursor-pointer">
                  <option value="alpha">🔤 依照英文字母順序 (A-Z)</option>
                  <option value="default">📄 依照匯入/加入順序</option>
                </select>
              </div>
              <div className="flex gap-2">
                <input type="text" value={customWordInput} onChange={(e) => setCustomWordInput(e.target.value)} placeholder="新增單字 (空白分隔)" className="flex-1 p-2 text-xs border border-gray-300 rounded-lg outline-none" />
                <button onClick={handleAddCustomWords} className="px-3 py-2 bg-gray-800 text-white font-bold rounded-lg text-xs hover:bg-gray-900 cursor-pointer">新增</button>
              </div>
            </div>

            <div className="flex-grow overflow-y-auto bg-white rounded-xl shadow-sm border border-gray-100 p-2 mb-3 no-scrollbar">
              {paginatedList.length === 0 ? <div className="text-center py-10 text-xs text-gray-400">找不到單字。</div> : (
                <div className="divide-y divide-gray-100">
                  {paginatedList.map(item => (
                    <div key={item.word} className="py-2.5 px-3 flex items-center justify-between hover:bg-indigo-50 transition rounded-lg text-sm">
                      <div className="flex flex-col w-[55%]">
                        <div className="flex items-center space-x-2 overflow-hidden cursor-pointer" onClick={() => openWordDetail(item)}>
                           <span className="font-bold text-gray-900 truncate text-base">{item.word}</span>
                           {item.note && <span className="text-amber-500 text-xs">📝</span>}
                        </div>
                        <div className="flex gap-2 mt-1">
                           <button type="button" onClick={(e) => speakWord(item.word, 'UK', e)} className="text-[10px] text-gray-500 hover:text-indigo-600 bg-gray-100 px-1.5 rounded cursor-pointer">🇬🇧 英</button>
                           <button type="button" onClick={(e) => speakWord(item.word, 'US', e)} className="text-[10px] text-gray-500 hover:text-indigo-600 bg-gray-100 px-1.5 rounded cursor-pointer">🇺🇸 美</button>
                        </div>
                      </div>
                      <div className="flex items-center space-x-2 shrink-0">
                        <select value={item.status} onChange={(e) => changeWordStatus(item.word, e.target.value)} className="text-[10px] px-1.5 py-1 rounded-md font-semibold outline-none border-0">
                          <option value="new">未學</option>
                          <option value="review">需複習</option>
                          <option value="known">已掌握</option>
                        </select>
                        <button type="button" onClick={(e) => triggerDelete(item.word, e)} className="p-1.5 text-gray-400 hover:text-red-500 cursor-pointer">🗑️</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="bg-gray-50 px-3 py-2 rounded-xl flex items-center justify-between text-xs border border-gray-200">
              <div className="flex items-center space-x-2 text-gray-500">
                <span>頁數:</span>
                <input type="number" min="1" max={totalPages} value={validPage} onChange={(e) => { const val = parseInt(e.target.value); if (!isNaN(val)) setListPage(Math.max(1, Math.min(totalPages, val))); }} className="w-12 text-center p-1 bg-white border border-gray-300 rounded font-bold text-indigo-600 outline-none" />
                <span>/ {totalPages}</span>
              </div>
              <div className="flex items-center space-x-1">
                <button onClick={() => setListPage(p => Math.max(1, p - 1))} disabled={validPage === 1} className="p-1 rounded bg-white border border-gray-300 disabled:opacity-40 cursor-pointer">◀</button>
                <button onClick={() => setListPage(p => Math.min(totalPages, p + 1))} disabled={validPage === totalPages} className="p-1 rounded bg-white border border-gray-300 disabled:opacity-40 cursor-pointer">▶</button>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-slate-50 font-sans pb-16">
          <header className="bg-white shadow-xs sticky top-0 z-20">
            <div className="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
              <div className="flex items-center text-indigo-600 cursor-pointer" onClick={() => words.length > 0 && setView('stats')}>
                <span className="text-lg mr-1.5">✨</span>
                <h1 className="font-bold text-sm tracking-tight">DSE 5000+ 單字神器</h1>
              </div>
              {words.length > 0 && (
                <button onClick={() => setView('list')} className="px-2.5 py-1.5 bg-indigo-50 text-indigo-700 font-semibold rounded-md text-xs hover:bg-indigo-100 flex items-center cursor-pointer">📋 管理</button>
              )}
            </div>
          </header>

          <main className="max-w-md mx-auto px-4">
            {view === 'import' && renderImport()}
            {view === 'study' && renderStudy()}
            {view === 'stats' && renderStats()}
            {view === 'list' && renderList()}
          </main>

          {activeDetailWord && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl flex flex-col max-h-[85vh]">
                <div className="flex justify-between items-start border-b pb-3 mb-3">
                  <div>
                     <h3 className="text-2xl font-black text-gray-900">{activeDetailWord.word}</h3>
                     <div className="flex gap-1.5 mt-2">
                        <button onClick={(e) => speakWord(activeDetailWord.word, 'UK', e)} className="px-2 py-1 bg-indigo-50 text-indigo-600 rounded text-[10px] font-bold hover:bg-indigo-100 cursor-pointer">🇬🇧 英式</button>
                        <button onClick={(e) => speakWord(activeDetailWord.word, 'US', e)} className="px-2 py-1 bg-indigo-50 text-indigo-600 rounded text-[10px] font-bold hover:bg-indigo-100 cursor-pointer">🇺🇸 美式</button>
                     </div>
                  </div>
                  <button onClick={() => setActiveDetailWord(null)} className="text-gray-400 p-1 cursor-pointer text-lg">✖</button>
                </div>
                
                <div className="flex-grow overflow-y-auto text-xs mb-3 max-h-[220px]">
                  {isLoadingDetailDef ? <div className="text-gray-400 text-center py-4">載入解釋中...</div> : detailDef?.notFound ? <div className="text-gray-400 py-2">無此單字解釋。</div> : (
                     <div className="space-y-3">
                        {/* 模態框中的繁體中文翻譯 */}
                        {(defLang === 'both' || defLang === 'zh') && detailDef?.translation && (
                           <div className="bg-indigo-50/50 p-2.5 rounded-lg border border-indigo-100">
                             <div className="text-[10px] text-indigo-400 font-bold mb-1 uppercase tracking-wider">繁體中文翻譯</div>
                             <div className="font-bold text-indigo-900 text-sm">{detailDef.translation}</div>
                           </div>
                        )}
                        
                        {/* 模態框中的英文解釋 */}
                        {(defLang === 'both' || defLang === 'en') && detailDef?.dict?.meanings && (
                           <div>
                             <div className="text-[10px] text-gray-400 font-bold mb-1 uppercase tracking-wider">English Definition</div>
                             {detailDef.dict.meanings.map((m, i) => (
                               <div key={i} className="mb-2">
                                  <span className="bg-gray-800 text-white px-1.5 py-0.5 rounded text-[10px] font-bold">{m.partOfSpeech}</span>
                                  <p className="mt-1 text-gray-700">{m.definitions[0]?.definition}</p>
                               </div>
                             ))}
                           </div>
                        )}
                     </div>
                  )}
                </div>
                <textarea value={detailNoteInput} onChange={(e) => setDetailNoteInput(e.target.value)} placeholder="輸入專屬備註..." className="w-full text-xs p-2.5 bg-amber-50/50 border border-amber-200 rounded-xl resize-none h-20 mb-3" />
                <button onClick={saveWordDetail} className="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl text-xs cursor-pointer">💾 確認儲存備註</button>
              </div>
            </div>
          )}

          {showClearConfirmModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl flex flex-col">
                <h3 className="text-lg font-black text-gray-900 text-center mb-2">確定要清空所有記錄？</h3>
                <p className="text-xs text-gray-500 text-center mb-6">這將會永久刪除你所有的單字進度，且無法復原！</p>
                <div className="flex gap-2">
                  <button onClick={() => setShowClearConfirmModal(false)} className="flex-1 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-xl text-xs cursor-pointer">取消</button>
                  <button onClick={executeClearAll} className="flex-1 py-2.5 bg-red-500 text-white font-bold rounded-xl text-xs cursor-pointer">確定清空</button>
                </div>
              </div>
            </div>
          )}

          {wordToDelete && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 w-full max-w-xs shadow-xl">
                <h3 className="text-lg font-bold text-gray-900 mb-2">確認刪除</h3>
                <p className="text-sm text-gray-500 mb-6">確定要刪除 <span className="font-bold text-red-500">"{wordToDelete}"</span> 嗎？</p>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setWordToDelete(null)} className="px-4 py-2 text-sm font-bold text-gray-600 bg-gray-100 rounded-lg cursor-pointer">取消</button>
                  <button onClick={confirmDelete} className="px-4 py-2 text-sm font-bold text-white bg-red-500 rounded-lg cursor-pointer">確認刪除</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
