<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSE 5000+ 單字神器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [words, setWords] = useState([]);
      const [view, setView] = useState('import');
      const [studyIndex, setStudyIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [definition, setDefinition] = useState(null);
      const [isLoadingDef, setIsLoadingDef] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [listPage, setListPage] = useState(1);
      
      // 下載與快取狀態
      const [isPreloading, setIsPreloading] = useState(false);
      const [preloadStats, setPreloadStats] = useState({ current: 0, total: 0 });
      const preloadRef = useRef(false);

      const LOCAL_STORAGE_KEY = 'dse_vocab_stable_v1';
      const LIST_PAGE_SIZE = 20;

      // 載入本地儲存
      useEffect(() => {
        const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setWords(parsed);
              setView('study');
            }
          } catch(e) {}
        }
      }, []);

      // 自動儲存
      useEffect(() => {
        if (words.length > 0) {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(words));
        }
      }, [words]);

      // 發音功能 (英式 / 美式)
      const speakWord = (wordStr, accent = 'US', e = null) => {
        if (e) e.stopPropagation();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(wordStr);
          utter.lang = accent === 'UK' ? 'en-GB' : 'en-US';
          window.speechSynthesis.speak(utter);
        }
      };

      // 翻卡片自動發音
      useEffect(() => {
        if (view === 'study' && words.length > 0 && words[studyIndex]) {
          const timer = setTimeout(() => {
            speakWord(words[studyIndex].word, 'US');
          }, 300);
          return () => clearTimeout(timer);
        }
      }, [view, studyIndex, words]);

      // 智慧字典抓取 (防止空白)
      const fetchWordData = async (wordStr, onUpdate) => {
        const lower = wordStr.toLowerCase();
        const cacheKey = `dse_cache_v1_${lower}`;
        let dataObj = { translation: null, enDef: [], phonetic: null, failed: false };

        const cached = localStorage.getItem(cacheKey);
        if (cached) {
          try { dataObj = JSON.parse(cached); } catch(e) {}
        }

        onUpdate(dataObj);

        if (dataObj.translation && dataObj.enDef.length > 0) return true;

        let success = false;
        try {
          // 抓取中文翻譯
          const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(lower)}`);
          if (res.ok) {
            const json = await res.json();
            if (json[0]?.[0]?.[0]) {
              dataObj.translation = json[0][0][0];
              success = true;
            }
          }
        } catch(e) {}

        try {
          // 抓取英英字典
          const res2 = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(lower)}`);
          if (res2.ok) {
            const json2 = await res2.json();
            if (json2[0]) {
              dataObj.phonetic = json2[0].phonetic || '';
              if (json2[0].meanings) {
                dataObj.enDef = json2[0].meanings.map(m => ({
                  pos: m.partOfSpeech,
                  def: m.definitions[0]?.definition
                })).slice(0, 2);
              }
              success = true;
            }
          }
        } catch(e) {}

        if (success) {
          onUpdate({ ...dataObj });
          try { localStorage.setItem(cacheKey, JSON.stringify(dataObj)); } catch(e) {}
          return true;
        } else {
          dataObj.translation = "查無解釋或連線受限";
          onUpdate({ ...dataObj });
          return false;
        }
      };

      const loadDefinition = async (wordStr) => {
        setIsLoadingDef(true);
        setDefinition(null);
        await fetchWordData(wordStr, (data) => {
          setDefinition(data);
          setIsLoadingDef(false);
        });
      };

      // 翻卡片
      const handleFlip = () => {
        if (!isFlipped && words.length > 0) {
          loadDefinition(words[studyIndex].word);
        }
        setIsFlipped(!isFlipped);
      };

      // 批次極速下載 (斷點續傳進度)
      const startPreload = async () => {
        const uncached = words.filter(w => !localStorage.getItem(`dse_cache_v1_${w.word.toLowerCase()}`));
        const total = words.length;
        const cachedCount = total - uncached.length;

        if (uncached.length === 0) {
          alert("所有單字翻譯已下載完畢！");
          return;
        }

        if (!window.confirm(`總字庫 ${total} 字，已下載 ${cachedCount} 字。\n準備下載剩餘的 ${uncached.length} 字？`)) return;

        setIsPreloading(true);
        preloadRef.current = true;
        setPreloadStats({ current: cachedCount, total });

        const CHUNK = 10;
        let done = 0;

        for (let i = 0; i < uncached.length; i += CHUNK) {
          if (!preloadRef.current) break;
          const chunk = uncached.slice(i, i + CHUNK);
          await Promise.allSettled(chunk.map(w => fetchWordData(w.word, () => {})));
          done += chunk.length;
          setPreloadStats({ current: Math.min(cachedCount + done, total), total });
          await new Promise(r => setTimeout(r, 50));
        }

        setIsPreloading(false);
        if (preloadRef.current) alert("離線翻譯包下載完成！");
      };

      // PDF 解析
      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        try {
          const buffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
          let fullText = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(item => item.str).join(' ') + ' ';
          }

          const matches = fullText.match(/\b[a-zA-Z]{3,15}\b/g);
          if (!matches) {
            alert("找不到有效單字！");
            return;
          }

          const unique = [...new Set(matches.map(w => w.toLowerCase()))];
          const newWords = unique.map(w => ({ word: w, status: 'new' }));
          setWords(newWords);
          setStudyIndex(0);
          setView('study');
          alert(`成功匯入 ${newWords.length} 個單字！`);
        } catch(err) {
          alert("PDF 讀取失敗：" + err.message);
        }
      };

      const markCard = (status) => {
        if (words.length === 0) return;
        const updated = [...words];
        updated[studyIndex].status = status;
        setWords(updated);
        setIsFlipped(false);
        if (studyIndex < words.length - 1) {
          setStudyIndex(prev => prev + 1);
        } else {
          alert("🎉 恭喜完成本輪溫習！");
          setView('stats');
        }
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col p-4 pb-12">
          {/* 導覽列 */}
          <header className="flex justify-between items-center py-3 mb-4 border-b">
            <h1 className="font-bold text-indigo-600 text-base cursor-pointer" onClick={() => setView('study')}>✨ DSE 5000 單字神器</h1>
            <div className="flex gap-2">
              {words.length > 0 && (
                <>
                  <button onClick={() => setView('stats')} className="px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded text-xs font-bold">統計</button>
                  <button onClick={() => setView('list')} className="px-2.5 py-1 bg-gray-100 text-gray-700 rounded text-xs font-bold">管理</button>
                </>
              )}
            </div>
          </header>

          {/* 1. 上傳介面 */}
          {view === 'import' && (
            <div className="flex flex-col items-center justify-center flex-grow py-12">
              <div className="bg-white p-6 rounded-3xl shadow-xl w-full text-center border">
                <div className="text-4xl mb-3">📄</div>
                <h2 className="text-lg font-bold mb-2">上傳 PDF 檔案</h2>
                <p className="text-xs text-gray-400 mb-6">自動擷取英文單字，支援離線快取</p>
                <input type="file" accept=".pdf,.txt" onChange={handleFileUpload} className="hidden" id="file-up" />
                <label htmlFor="file-up" className="block w-full py-3 bg-indigo-600 text-white font-bold rounded-xl text-xs cursor-pointer shadow">
                  選擇檔案上傳
                </label>
              </div>
            </div>
          )}

          {/* 2. 溫習介面 */}
          {view === 'study' && words.length > 0 && (
            <div className="flex flex-col flex-grow">
              <div className="flex justify-between items-center text-xs text-gray-500 mb-2 font-mono font-bold">
                <span>進度: {studyIndex + 1} / {words.length}</span>
                <span>狀態: {words[studyIndex].status}</span>
              </div>
              <div className="w-full bg-gray-200 h-1.5 rounded-full mb-4 overflow-hidden">
                <div className="bg-indigo-600 h-full transition-all" style={{ width: `${((studyIndex + 1) / words.length) * 100}%` }}></div>
              </div>

              {/* 字卡主體 */}
              <div className="bg-white rounded-3xl shadow-xl border p-6 min-h-[340px] flex flex-col relative justify-between mb-4">
                {!isFlipped ? (
                  <div className="flex flex-col items-center justify-center flex-grow cursor-pointer text-center" onClick={handleFlip}>
                    <span className="text-[10px] bg-indigo-50 text-indigo-500 px-2 py-0.5 rounded-full font-bold mb-4">點擊卡片看翻譯</span>
                    <h2 className="text-4xl font-black text-gray-900 mb-6">{words[studyIndex].word}</h2>
                    <div className="flex gap-3">
                      <button onClick={(e) => speakWord(words[studyIndex].word, 'UK', e)} className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-bold">🇬🇧 英式發音</button>
                      <button onClick={(e) => speakWord(words[studyIndex].word, 'US', e)} className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-bold">🇺🇸 美式發音</button>
                    </div>
                  </div>
                ) : (
                  <div className="flex flex-col h-full text-left">
                    <div className="flex justify-between items-start border-b pb-2 mb-3">
                      <div>
                        <h2 className="text-2xl font-black">{words[studyIndex].word}</h2>
                        {definition?.phonetic && <span className="text-xs text-gray-400 font-mono">{definition.phonetic}</span>}
                      </div>
                      <div className="flex gap-1.5">
                        <button onClick={(e) => speakWord(words[studyIndex].word, 'UK', e)} className="p-1.5 bg-indigo-50 text-indigo-700 rounded text-xs font-bold">🇬🇧</button>
                        <button onClick={(e) => speakWord(words[studyIndex].word, 'US', e)} className="p-1.5 bg-indigo-50 text-indigo-700 rounded text-xs font-bold">🇺🇸</button>
                      </div>
                    </div>
                    <div className="flex-grow overflow-y-auto text-xs space-y-3">
                      {isLoadingDef ? (
                        <div className="text-center text-gray-400 py-6">載入解釋中...</div>
                      ) : (
                        <>
                          <div className="bg-indigo-50/60 p-3 rounded-xl border border-indigo-100">
                            <span className="text-[10px] text-indigo-400 font-bold block mb-1">繁體中文翻譯</span>
                            <span className="text-sm font-bold text-indigo-900">{definition?.translation || '暫無翻譯'}</span>
                          </div>
                          {definition?.enDef?.length > 0 && (
                            <div>
                              <span className="text-[10px] text-gray-400 font-bold block mb-1">English Definition</span>
                              {definition.enDef.map((d, i) => (
                                <div key={i} className="mb-1"><span className="bg-gray-200 px-1 rounded text-[10px] font-bold mr-1">{d.pos}</span>{d.def}</div>
                              ))}
                            </div>
                          )}
                        </>
                      )}
                    </div>
                  </div>
                )}
              </div>

              {/* 底部按鈕 */}
              <div className="flex gap-2">
                <button onClick={() => markCard('review')} className="flex-1 py-3 bg-white border border-orange-200 text-orange-600 font-bold rounded-xl text-xs shadow-sm">🔄 忘記了</button>
                <button onClick={() => markCard('new')} className="flex-1 py-3 bg-white border border-gray-200 text-gray-500 font-bold rounded-xl text-xs shadow-sm">⏭ 跳過</button>
                <button onClick={() => markCard('known')} className="flex-1 py-3 bg-white border border-green-200 text-green-600 font-bold rounded-xl text-xs shadow-sm">✅ 記得</button>
              </div>
            </div>
          )}

          {/* 3. 統計與下載介面 */}
          {view === 'stats' && (
            <div className="flex flex-col gap-4 py-4">
              <h2 className="text-lg font-bold text-center">學習進度總覽</h2>
              <div className="grid grid-cols-3 gap-2 text-center">
                <div className="bg-white p-3 rounded-xl border"><p className="text-[10px] text-gray-400">已掌握</p><p className="text-lg font-bold text-green-600">{words.filter(w=>w.status==='known').length}</p></div>
                <div className="bg-white p-3 rounded-xl border"><p className="text-[10px] text-gray-400">需複習</p><p className="text-lg font-bold text-orange-600">{words.filter(w=>w.status==='review').length}</p></div>
                <div className="bg-white p-3 rounded-xl border"><p className="text-[10px] text-gray-400">未學習</p><p className="text-lg font-bold text-gray-600">{words.filter(w=>w.status==='new').length}</p></div>
              </div>

              <div className="bg-white p-4 rounded-xl border shadow-sm">
                <label className="text-xs font-bold text-gray-700 block mb-2">📥 離線翻譯極速下載：</label>
                {isPreloading ? (
                  <div className="text-xs font-bold text-indigo-600">
                    下載中... {preloadStats.current} / {preloadStats.total} ({Math.round((preloadStats.current/preloadStats.total)*100)}%)
                    <button onClick={()=>{preloadRef.current=false;setIsPreloading(false);}} className="ml-2 text-red-500 underline">暫停</button>
                  </div>
                ) : (
                  <button onClick={startPreload} className="w-full py-2.5 bg-green-50 text-green-700 border border-green-200 font-bold rounded-lg text-xs">⚡ 一鍵下載全部翻譯 (斷點續傳)</button>
                )}
              </div>

              <button onClick={() => setView('study')} className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl text-xs shadow">返回溫習</button>
              <button onClick={() => { localStorage.removeItem(STORAGE_KEY_WORDS); setWords([]); setView('import'); }} className="text-red-500 text-xs font-bold text-center underline">清空所有單字</button>
            </div>
          )}

          {/* 4. 管理介面 */}
          {view === 'list' && (
            <div className="flex flex-col flex-grow py-2">
              <div className="flex justify-between items-center mb-3">
                <h2 className="text-sm font-bold">字庫清單 ({words.length})</h2>
                <button onClick={() => setView('study')} className="px-3 py-1 bg-indigo-600 text-white rounded text-xs font-bold">返回</button>
              </div>
              <input type="text" placeholder="搜尋單字..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="w-full p-2 text-xs border rounded-lg mb-3 outline-none" />
              <div className="flex-grow overflow-y-auto bg-white rounded-xl border p-2 divide-y max-h-[60vh] no-scrollbar">
                {words.filter(w => w.word.includes(searchQuery.toLowerCase())).slice((listPage-1)*LIST_PAGE_SIZE, listPage*LIST_PAGE_SIZE).map((w, i) => (
                  <div key={w.word} className="py-2 px-2 flex justify-between items-center text-xs">
                    <span className="font-bold">{w.word}</span>
                    <div className="flex gap-1">
                      <button onClick={()=>speakWord(w.word, 'UK')} className="px-2 py-1 bg-indigo-50 text-indigo-700 rounded font-bold">🇬🇧</button>
                      <button onClick={()=>speakWord(w.word, 'US')} className="px-2 py-1 bg-indigo-50 text-indigo-700 rounded font-bold">🇺🇸</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
